name: Pipeline CI - Validation du Projet GestPR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1 : Backend .NET 8
  # -------------------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code (Checkout)
      uses: actions/checkout@v4

    - name: Configuration de .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restauration des packages NuGet
      run: dotnet restore
      working-directory: ./GestPR  # Ajustez si le nom du dossier backend diffère

    - name: Compilation du Backend .NET
      run: dotnet build --no-restore --configuration Release
      working-directory: ./GestPR  # Ajustez si le nom du dossier backend diffère

  # -------------------------------------------------------------
  # JOB 2 : Frontend React
  # -------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code (Checkout)
      uses: actions/checkout@v4

    - name: Configuration de Node.js (v20)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Installation des dépendances NPM
      run: npm install
      working-directory: ./Frontend  # Ajustez si le nom du dossier frontend diffère

    - name: Build de l'application React
      run: npm run build
      working-directory: ./Frontend  # Ajustez si le nom du dossier frontend differs