version: '3.8'

services:
  # ----------------------------------------
  # 1. Base de données SQL Server
  # ----------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestpr-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Star2026!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Star2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------
  # 2. Base de données MongoDB (Journal d'audit)
  # ----------------------------------------
  mongodb:
    image: mongo:latest
    container_name: gestpr-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # ----------------------------------------
  # 3. Cache Redis
  # ----------------------------------------
  redis:
    image: redis:alpine
    container_name: gestpr-redis
    restart: always
    ports:
      - "6379:6379"

  # ----------------------------------------
  # 4. Backend .NET 8 API
  # ----------------------------------------
  backend:
    image: gestpr_backend
    build:
      context: ./GestPR
      dockerfile: Dockerfile
    container_name: gestpr-api
    dns: 
      - 10.123.240.40
      - 10.123.240.41
      - 8.8.8.8
    ports:
      - "5000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "STASRV26005:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=prix_revien_db;User Id=sa;Password=Star2026!;TrustServerCertificate=True;Encrypt=False;"
      MongoDbSetting__ConnectionString: "mongodb://mongodb:27017"
      MongoDbSetting__DatabaseName: "GestPR_Audit"
      ConnectionStrings__Redis: "redis:6379"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  # ----------------------------------------
  # 5. Frontend React
  # ----------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"

volumes:
  sqlserver_data:
  mongodb_data: